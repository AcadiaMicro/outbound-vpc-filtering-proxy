# Modified for Ampion utility api. no need for whitelisting domains
# Remove the whitelist domains parameter
# Remove the GetSecret Policy
# Remove the Proxy-Domains-Whitelisting Secret
# Remove the /root/fetch-config-cron.sh script
# Remove the /etc/squid/squid.allowed.sites.txt file

Description: Outbound filtering proxy

Parameters:

  NamePrefix:
    Type: String
    Default: ''
    # NLB and target group names are capped at 32 chars: 'OutboundProxyLoadBalancer' is 25, so max 7 here.
    AllowedPattern: ^([A-Za-z0-9][A-Za-z0-9-]{0,6})?$
    Description: Prefix for NLB, target group and export names. Leave empty for the production stack; use e.g. Sbx- for a sandbox copy so names do not collide.

  CustomDNS:
    Type: String
    Default: default
    Description: Provide optional a DNS server for domain filtering, like OpenDNS (comma separated, like 8.8.8.8,8.8.8.7)
  
  KeyName:
    Type: "String"
    Description: Name of RSA key for EC2 access for testing only.
    Default: ''

  ProxyPort:
    Type: String
    Default: 3128
    Description: Port Proxy 

  
  VpcId: 
    Description: VPC ID Where the Proxy will be installed
    Type: "AWS::EC2::VPC::Id"

  PrivateSubnetIDs: 
    Description: Private SubnetIDs where the Network LoadBalancer will be placed (Select min 2 max 3)
    Type: "List<AWS::EC2::Subnet::Id>"
  
  PublicSubnetIDs: 
    Description: Public SubnetIDs where the proxy will be placed (Select min 2 max 3)
    Type: "List<AWS::EC2::Subnet::Id>"
  
  InstanceType:
    Description: WebServer EC2 instance type
    Type: String
    Default: t3.medium
    AllowedValues:
    - t3.nano
    - t3.micro
    - t3.small
    - t3.medium
    - t3.large
    - m3.medium
    - m3.large
    - m3.xlarge
    - m3.2xlarge
    - m4.large
    - m4.xlarge
    - m4.2xlarge
    - m5.large
    - m5.xlarge
    - m5.2xlarge
    - c3.large
    - c3.xlarge
    - c4.large
    ConstraintDescription: must be a valid EC2 instance type.

  NetworkAllowedCIDR:
    Description: CIDR allowed in Proxy Security Group. The allowed block size is between a /32 netmask and /8 netmask
    Type: String
    Default: 172.31.0.0/16
    AllowedPattern: ^[.0-9]*\/([89]|[12][0-9]|3[0-2])$

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2'
    Description: AMI ID pointer in SSM. Default latest AMI Amazon Linux2.   

Metadata:
  'AWS::CloudFormation::Interface':
    ParameterGroups:
    - Label:
        default: Proxy parameter
      Parameters:
      - CustomDNS  
      - ProxyPort
      - InstanceType
      - LatestAmiId
      - KeyName

    - Label:
        default: Network parameter
      Parameters:
      - VpcId
      - PrivateSubnetIDs
      - PublicSubnetIDs 
      - NetworkAllowedCIDR

    ParameterLabels:
      CustomDNS:
        default: Custom DNS servers
      ProxyPort:
        default: Proxy Port
      InstanceType:
        default: Instance Type
      LatestAmiId:
        default: AMI ID  
      KeyName: 
        default: SSH Key name
      VpcId:
        default: VPC ID
      PrivateSubnetIDs:
        default: Private Subnet IDs
      PublicSubnetIDs:
        default: Public Subnet IDs
      NetworkAllowedCIDR:
        default: Allowed client CIRD


Conditions:

  AddSSHKey: !Not
   - !Equals
     - ''
     - !Ref KeyName

Resources:

  OutboundProxyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "Outbound-proxy-${AWS::StackName}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - ec2.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      ManagedPolicyArns:
      # OPS-447: Session Manager access (replaces the temporary port-22 rule)
      - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
      - PolicyName: LogRolePolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogStreams
            Resource:
             - !GetAtt OutboundProxyLogGroup.Arn
      # OPS-447: scoped. AssociateAddress authorizes against the elastic-ip AND the
      # instance (and/or network-interface), so all three resource types are listed.
      # The two removed policies (RevokeAuthorizeSG, CloudWatchMetric) had no users.
      - PolicyName: AssociateEIP
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ec2:AssociateAddress
            Resource:
            - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/${FixedEIPa.AllocationId}'
            - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/${FixedEIPb.AllocationId}'
            - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/${FixedEIPc.AllocationId}'
            - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/${FixedEIPd.AllocationId}'
            - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
            - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*'
          - Effect: Allow
            Action:
            # Describe* cannot be resource-scoped
            - ec2:DescribeAddresses
            Resource:
            - "*"
      - PolicyName: TargetHealthRead
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            # used by the boot-time signal gate: signal only once this instance is healthy in the NLB
            - elasticloadbalancing:DescribeTargetHealth
            Resource:
            - "*"

  FixedEIPa:
    Type: AWS::EC2::EIP
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Domain: vpc
  
  FixedEIPb:
    Type: AWS::EC2::EIP
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Domain: vpc

  FixedEIPc:
    Type: AWS::EC2::EIP
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Domain: vpc

  FixedEIPd:
    Type: AWS::EC2::EIP
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Domain: vpc

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internal
      Type: network
      Name: !Sub '${NamePrefix}OutboundProxyLoadBalancer'
      Subnets: !Ref PrivateSubnetIDs
  
  NetworkLoadBalancerTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${NamePrefix}OutboundProxyTargetGroup'
      Port: !Ref ProxyPort
      Protocol: TCP
      VpcId: !Ref VpcId
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 60 
      Tags:
        - Key: Name
          Value: SMARTProxyTargetGroup
  LoadBalancerListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
      - Type: forward
        TargetGroupArn: !Ref NetworkLoadBalancerTargetGroup
      LoadBalancerArn: !Ref LoadBalancer
      Port: !Ref ProxyPort
      Protocol: TCP

  OutboundProxyProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      InstanceProfileName: !Sub "Proxy-EC2-${AWS::StackName}"
      Roles: 
        - !Ref OutboundProxyRole

  OutboundProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow access to Outbound Proxy
      VpcId: !Ref VpcId
      SecurityGroupIngress:
      - CidrIp: !Ref NetworkAllowedCIDR
        FromPort: !Ref ProxyPort
        ToPort: !Ref ProxyPort
        IpProtocol: tcp

  OutboundProxyASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier: !Ref PublicSubnetIDs
      Cooldown: 120
      # $Latest/$Default are not supported in CFN. Any change to the LaunchTemplate (even a
      # user-data comment) bumps LatestVersionNumber and triggers a full terminate-first roll.
      LaunchTemplate:
        LaunchTemplateId: !Ref OutboundProxyLaunchTemplate
        Version: !GetAtt OutboundProxyLaunchTemplate.LatestVersionNumber
      MaxSize: 3
      MinSize: 2
      DesiredCapacity: 2
      TargetGroupARNs:
        - Ref: "NetworkLoadBalancerTargetGroup"
      TerminationPolicies:
      - OldestInstance
      Tags:
      - Key: Name
        PropagateAtLaunch: 'true'
        Value: outbound-proxy
      - Key: AppVersion
        PropagateAtLaunch: 'true'
        Value: 1.0.0
      - Key: ApplicationID
        PropagateAtLaunch: 'true'
        Value: outbound-proxy
    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M
        # create-time only (ignored on updates). Was '1' with DesiredCapacity 2 (latent bug).
        Count: '2'
    UpdatePolicy:
      AutoScalingScheduledAction:
        IgnoreUnmodifiedGroupSizeProperties: true
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT15M
        WaitOnResourceSignals: 'true'
        # OPS-447: also stop CPU-alarm scale-out, AZ rebalancing and health replacement from
        # launching an extra instance mid-roll (two concurrent boots could race for an EIP)
        SuspendProcesses:
        - ScheduledActions
        - AlarmNotification
        - AZRebalance
        - ReplaceUnhealthy

  ScaleOutPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AdjustmentType: ChangeInCapacity
      AutoScalingGroupName:
        Ref: OutboundProxyASG
      Cooldown: '90'
      ScalingAdjustment: '1'

  CPUAlarmHigh:
    Type: AWS::CloudWatch::Alarm
    Properties:
      EvaluationPeriods: '1'
      Statistic: Average
      Threshold: '80'
      AlarmDescription: Alarm if CPU too high (50%) or metric disappears indicating instance
        is down
      Period: '60'
      AlarmActions:
      - Ref: ScaleOutPolicy
      Namespace: AWS/EC2
      Dimensions:
      - Name: AutoScalingGroupName
        Value:
          Ref: OutboundProxyASG
      ComparisonOperator: GreaterThanThreshold
      MetricName: CPUUtilization

  ScaleInPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AdjustmentType: ChangeInCapacity
      AutoScalingGroupName:
        Ref: OutboundProxyASG
      Cooldown: '90'
      ScalingAdjustment: '-1'

  CPUAlarmLow:
    Type: AWS::CloudWatch::Alarm
    Properties:
      EvaluationPeriods: '1'
      Statistic: Average
      Threshold: '10'
      AlarmDescription: Alarm if CPU low (10%) or metric disappears indicating instance
        is down
      Period: '60'
      AlarmActions:
      - Ref: ScaleInPolicy
      Namespace: AWS/EC2
      Dimensions:
      - Name: AutoScalingGroupName
        Value:
          Ref: OutboundProxyASG
      ComparisonOperator:  LessThanThreshold
      MetricName: CPUUtilization

  # OPS-447: replaces AWS::AutoScaling::LaunchConfiguration (deprecated) and the cfn-init/cfn-hup
  # metadata. Files are written from user-data, so any config change is a new LaunchTemplate
  # version and an immutable roll. User-data is written to run unchanged on AL2 and AL2023, so
  # rollback is just LatestAmiId -> the AL2 SSM path.
  OutboundProxyLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        KeyName: !If
          - AddSSHKey
          - !Ref KeyName
          - !Ref "AWS::NoValue"
        IamInstanceProfile:
          Arn: !GetAtt OutboundProxyProfile.Arn
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        # SGs must live in the network interface when AssociatePublicIpAddress is set here.
        # No SubnetId: the ASG's VPCZoneIdentifier chooses the subnet.
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            DeleteOnTermination: true
            Groups:
              - !Ref OutboundProxySecurityGroup
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -Eeuxo pipefail

            # 1. cfn-bootstrap first, so error_exit can signal a failure instead of waiting out PauseTime
            yum install -y aws-cfn-bootstrap
            error_exit() {
              /opt/aws/bin/cfn-signal -e 1 --stack "${AWS::StackName}" --resource OutboundProxyASG --region "${AWS::Region}" --reason "$1" || true
              exit 1
            }
            trap 'error_exit "user-data failed at line $LINENO"' ERR

            # IMDSv2 token helper (also works on AL2)
            imds() {
              local t
              t=$(curl -sS -X PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 300')
              curl -sS -H "X-aws-ec2-metadata-token: $t" "http://169.254.169.254/latest/$1"
            }
            INSTANCE_ID=$(imds meta-data/instance-id)
            echo "instance $INSTANCE_ID; CustomDNS=${CustomDNS} (unused since OPS-447)"

            # 2. packages (no yum update here: patching comes from the AMI via LatestAmiId)
            yum install -y squid amazon-cloudwatch-agent
            command -v aws >/dev/null || yum install -y awscli

            # 3. squid.conf: must parse on squid 3.5 (AL2) and 6.x (AL2023)
            cat > /etc/squid/squid.conf <<'SQUIDCONF'
            acl localnet src 10.0.0.0/8
            acl localnet src 172.16.0.0/12
            acl localnet src 192.168.0.0/16
            acl localnet src fc00::/7
            acl localnet src fe80::/10

            # metadata service and all link-local (explicit acl so this parses on squid 3.5 and 6)
            acl linklocal dst 169.254.0.0/16

            acl SSL_ports port 443
            # 8443 = CMP; unused in 30d but kept (removal would be a behaviour change)
            acl SSL_ports port 8443
            # 8443 omitted here: already inside 1025-65535 (avoids an overlap warning)
            acl Safe_ports port 80 21 443 70 210 1025-65535 280 488 591 777
            # not named CONNECT: squid 3.5 has no built-in CONNECT, squid 6 does
            acl connect_method method CONNECT

            http_access deny linklocal
            http_access deny !Safe_ports
            http_access deny connect_method !SSL_ports
            http_access allow localhost manager
            http_access deny manager
            http_access deny to_localhost
            # explicit allows (3.5 relied on implicit default-allow) + terminal deny
            http_access allow localnet
            # needed: the on-box signal gate and V3 curl via -x 127.0.0.1:${ProxyPort}
            http_access allow localhost
            http_access deny all

            # ssl-bump removed: no ssl_bump rules existed; 100% TCP_TUNNEL in logs
            http_port 0.0.0.0:${ProxyPort}
            coredump_dir /var/spool/squid
            refresh_pattern ^ftp: 1440 20% 10080
            refresh_pattern -i (/cgi-bin/|\?) 0 0% 0
            refresh_pattern . 0 20% 4320
            SQUIDCONF
            squid -k parse

            # 4. CloudWatch agent: ship squid access.log to the existing log group (same stream name as before)
            cat > /opt/aws/amazon-cloudwatch-agent/etc/proxy.json <<'CWCONF'
            {
              "agent": { "run_as_user": "root" },
              "logs": {
                "logs_collected": {
                  "files": {
                    "collect_list": [
                      {
                        "file_path": "/var/log/squid/access.log",
                        "log_group_name": "${OutboundProxyLogGroup}",
                        "log_stream_name": "{instance_id}/squid_access.log"
                      }
                    ]
                  }
                }
              }
            }
            CWCONF

            # 5. race-safe EIP association: never steal an EIP held by another instance
            EIP_ALLOCS="${FixedEIPa.AllocationId} ${FixedEIPb.AllocationId} ${FixedEIPc.AllocationId} ${FixedEIPd.AllocationId}"
            ASSOCIATED=""
            for _attempt in 1 2 3 4 5 6; do
              for A in $EIP_ALLOCS; do
                CUR=$(aws ec2 describe-addresses --region ${AWS::Region} --allocation-ids "$A" --query 'Addresses[0].AssociationId' --output text 2>/dev/null) || CUR=ERR
                if [ "$CUR" = "None" ]; then
                  if aws ec2 associate-address --region ${AWS::Region} --instance-id "$INSTANCE_ID" --allocation-id "$A" --no-allow-reassociation >/dev/null 2>&1; then
                    ASSOCIATED=$A
                    break 2
                  fi
                fi
              done
              sleep 5
            done
            [ -n "$ASSOCIATED" ] || error_exit "no free EIP could be associated"
            echo "associated $ASSOCIATED"

            # 6. start services (enable && start, not enable --now: AL2 has systemd 219)
            systemctl enable squid
            systemctl start squid
            /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/etc/proxy.json -s

            # 7. signal gate: only things this instance controls. A slow third-party site must not roll back the migration.
            PROXY="http://127.0.0.1:${ProxyPort}"
            for _try in $(seq 1 30); do systemctl is-active --quiet squid && break; sleep 2; done
            systemctl is-active --quiet squid || error_exit "gate: squid not active"

            # (3) egress IP must be one of this stack's 4 EIPs (EIP propagation can take a few seconds)
            EIP_IPS=" ${FixedEIPa} ${FixedEIPb} ${FixedEIPc} ${FixedEIPd} "
            EGRESS=""
            for _try in $(seq 1 12); do
              EGRESS=$(curl -sS -m 15 -x "$PROXY" https://checkip.amazonaws.com 2>/dev/null | tr -d '[:space:]') || EGRESS=""
              case "$EIP_IPS" in *" $EGRESS "*) [ -n "$EGRESS" ] && break ;; esac
              sleep 5
            done
            case "$EIP_IPS" in *" $EGRESS "*) [ -n "$EGRESS" ] || error_exit "gate: empty egress ip" ;; *) error_exit "gate: egress ip [$EGRESS] is not one of the stack EIPs" ;; esac
            echo "egress ip $EGRESS ok"

            # (4) a GCP API is reachable through the proxy
            GCODE=$(curl -sS -m 20 -x "$PROXY" -o /dev/null -w '%{http_connect}' https://oauth2.googleapis.com 2>/dev/null) || GCODE=""
            [ "$GCODE" = "200" ] || error_exit "gate: googleapis CONNECT returned [$GCODE]"

            # utility sites: logged, NON-gating
            for H in ebiz1.nyseg.com secure.comed.com www.ameren.com; do
              UCODE=$(curl -sS -m 10 -x "$PROXY" -o /dev/null -w '%{http_connect}' "https://$H/" 2>/dev/null) || UCODE=fail
              echo "utility check $H connect=$UCODE (informational)"
            done

            # (5) wait until this instance is healthy in the NLB target group, so a terminate-first
            # roll never removes the last healthy target before this one is serving
            HEALTHY=no
            for _try in $(seq 1 30); do
              ST=$(aws elbv2 describe-target-health --region ${AWS::Region} --target-group-arn ${NetworkLoadBalancerTargetGroup} --targets Id="$INSTANCE_ID" --query 'TargetHealthDescriptions[0].TargetHealth.State' --output text 2>/dev/null) || ST=unregistered
              echo "target health: $ST"
              if [ "$ST" = "healthy" ]; then HEALTHY=yes; break; fi
              sleep 10
            done
            [ "$HEALTHY" = "yes" ] || error_exit "gate: instance not healthy in target group after 300s"

            trap - ERR
            /opt/aws/bin/cfn-signal -e 0 --stack "${AWS::StackName}" --resource OutboundProxyASG --region "${AWS::Region}"
            echo "User data done"

  OutboundProxyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30
      LogGroupName: !Sub "Proxy-${AWS::StackName}"

Outputs:
  CloudWatchLogGroupName:
    Description: The name of the CloudWatch log group for outbound proxy
    Value: !Ref OutboundProxyLogGroup
    Export:
      Name: !Sub '${NamePrefix}Proxy-CloudWatchLogGroupName'

  OutboundProxyDomain:
    Description: Proxy DNS name to be used in the clients 
    Value: !GetAtt LoadBalancer.DNSName
    Export: 
        Name: !Sub '${NamePrefix}Proxy-Domain'

  OutboundProxyPort:
    Description: Port of the Proxy 
    Value: !Ref ProxyPort
    Export:
      Name: !Sub '${NamePrefix}Proxy-Port'
  
  EgressIP1:
    Description: Outbound Proxy source IP (first)
    Value: !Ref FixedEIPa
    Export: 
        Name: !Sub '${NamePrefix}Proxy-Egress-IP-1'
  EgressIP2:
    Description: Outbound Proxy source IP (second)
    Value: !Ref FixedEIPb
    Export: 
        Name: !Sub '${NamePrefix}Proxy-Egress-IP-2'
  EgressIP3:
    Description: Outbound Proxy source IP (third) 
    Value: !Ref FixedEIPc
    Export: 
        Name: !Sub '${NamePrefix}Proxy-Egress-IP-3'
  EgressIP4:
    Description: Outbound Proxy source IP (fourth)
    Value: !Ref FixedEIPd
    Export: 
        Name: !Sub '${NamePrefix}Proxy-Egress-IP-4'

  SecurityGroupProxy:
    Description: Proxy security group 
    Value: SecurityGroup_Proxy
    Export: 
        Name: !Sub '${NamePrefix}Proxy-SecurityGroup'

  LinuxProxySettings:
    Description: Linux proxy settings. Copy and paste to your shell to set the proxy
    Value: !Sub "export http_proxy=http://${LoadBalancer.DNSName}:${ProxyPort} && export https_proxy=$http_proxy"
    Export: 
      Name: !Sub '${NamePrefix}LinuxProxySettings'





